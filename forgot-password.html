<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password — EDIT24/7</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 450px;
      margin: auto;
    }

    header {
      padding: 25px 0;
      text-align: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #ff3b30;
    }

    main {
      padding: 55px 0;
    }

    .box {
      background: #111;
      border: 1px solid #252525;
      border-radius: 16px;
      padding: 32px;
    }

    .icon {
      width: 55px;
      height: 55px;
      margin: 0 auto 20px;
      border: 1px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      background: #090909;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #ff3b30;
    }

    .reset-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #ff3b30;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
    }

    .back a {
      color: #ff3b30;
      text-decoration: none;
      font-weight: bold;
    }

    .note {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      EDIT<span>24/7</span>
    </div>
  </header>


  <main>

    <div class="container">

      <div class="box">

        <div class="icon">
          🔐
        </div>

        <h1>Forgot Password?</h1>

        <p class="subtitle">
          Enter your email and we'll help you reset
          your EDIT24/7 account password.
        </p>


        <form>

          <div class="form-group">

            <label for="email">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            >

          </div>


          <button
            type="submit"
            class="reset-btn"
          >
            Send Reset Link →
          </button>

        </form>


        <div class="back">

          <a href="login.html">
            ← Back to Login
          </a>

        </div>


        <div class="note">
          Password reset will work after the authentication
          system is connected.
        </div>

      </div>

    </div>

  </main>

</body>
</html>
