<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — EDIT24/7</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: auto;
    }

    /* HEADER */

    header {
      padding: 25px 0;
      text-align: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ff3b30;
    }

    /* MAIN */

    main {
      padding: 30px 0 70px;
    }

    .signup-box {
      background: #111;
      border: 1px solid #252525;
      border-radius: 16px;
      padding: 32px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* ROLE */

    .role-title {
      font-size: 13px;
      font-weight: bold;
      color: #aaa;
      margin-bottom: 12px;
    }

    .roles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .role-card {
      position: relative;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .role-card:hover {
      border-color: #777;
    }

    .role-card input {
      position: absolute;
      opacity: 0;
    }

    .role-card.active {
      border-color: #ff3b30;
      background: #19100f;
    }

    .role-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .role-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .role-description {
      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }

    /* FORM */

    .form-group {
      margin-bottom: 19px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label.form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .required {
      color: #ff3b30;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 13px;
      background: #090909;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff3b30;
    }

    .password-note {
      color: #666;
      font-size: 11px;
      margin-top: 6px;
    }

    /* TERMS */

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      color: #888;
      font-size: 12px;
      margin: 22px 0;
      line-height: 1.5;
    }

    .terms input {
      margin-top: 3px;
    }

    .terms a {
      color: #ff3b30;
    }

    /* MESSAGE */

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      background: #241212;
      border: 1px solid #4a2222;
      color: #ff8b84;
      font-size: 12px;
      text-align: center;
    }

    .message.success {
      background: #102014;
      border-color: #234d2c;
      color: #8fe39e;
    }

    /* BUTTON */

    .signup-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #ff3b30;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-btn:hover {
      opacity: 0.9;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #555;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #292929;
      flex: 1;
    }

    /* LOGIN */

    .login {
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    .login a {
      color: #ff3b30;
      font-weight: bold;
    }

    .note {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .back-home {
      display: block;
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 18px;
    }

    .back-home:hover {
      color: white;
    }

    /* MOBILE */

    @media (max-width: 550px) {

      .signup-box {
        padding: 22px;
      }

      .roles,
      .row {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <a href="index.html" class="logo">
      EDIT<span>24/7</span>
    </a>

  </header>


  <!-- MAIN -->

  <main>

    <div class="container">

      <div class="signup-box">

        <h1>
          Create Your Account
        </h1>

        <p class="subtitle">
          Join the EDIT24/7 marketplace.
        </p>


        <!-- ROLE SELECTION -->

        <div class="role-title">
          I want to:
        </div>


        <div class="roles">


          <!-- CUSTOMER -->

          <label class="role-card active">

            <input
              type="radio"
              name="role"
              value="customer"
              checked
            >

            <div class="role-icon">
              🎬
            </div>

            <div class="role-name">
              Hire an Editor
            </div>

            <div class="role-description">
              I need someone to edit my videos.
            </div>

          </label>


          <!-- EDITOR -->

          <label class="role-card">

            <input
              type="radio"
              name="role"
              value="editor"
            >

            <div class="role-icon">
              💻
            </div>

            <div class="role-name">
              Work as an Editor
            </div>

            <div class="role-description">
              I want to edit videos for clients.
            </div>

          </label>

        </div>


        <!-- MESSAGE -->

        <div
          id="message"
          class="message"
        ></div>


        <!-- SIGNUP FORM -->

        <form id="signupForm">


          <!-- NAME -->

          <div class="row">


            <div class="form-group">

              <label
                class="form-label"
                for="firstName"
              >
                First Name
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="firstName"
                placeholder="First name"
                required
              >

            </div>


            <div class="form-group">

              <label
                class="form-label"
                for="lastName"
              >
                Last Name
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="lastName"
                placeholder="Last name"
                required
              >

            </div>

          </div>


          <!-- EMAIL -->

          <div class="form-group">

            <label
              class="form-label"
              for="email"
            >
              Email
              <span class="required">*</span>
            </label>

            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            >

          </div>


          <!-- PHONE -->

          <div class="form-group">

            <label
              class="form-label"
              for="phone"
            >
              Phone Number
              <span class="required">*</span>
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="+91 XXXXX XXXXX"
              required
            >

          </div>


          <!-- PASSWORD -->

          <div class="form-group">

            <label
              class="form-label"
              for="password"
            >
              Password
              <span class="required">*</span>
            </label>

            <input
              type="password"
              id="password"
              placeholder="Create a password"
              minlength="8"
              required
            >

            <div class="password-note">
              Use at least 8 characters.
            </div>

          </div>


          <!-- CONFIRM PASSWORD -->

          <div class="form-group">

            <label
              class="form-label"
              for="confirmPassword"
            >
              Confirm Password
              <span class="required">*</span>
            </label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Enter password again"
              minlength="8"
              required
            >

          </div>


          <!-- TERMS -->

          <label class="terms">

            <input
              type="checkbox"
              id="terms"
              required
            >

            <span>
              I agree to the EDIT24/7
              <a href="#">Terms of Service</a>
              and
              <a href="#">Privacy Policy</a>.
            </span>

          </label>


          <!-- SUBMIT -->

          <button
            type="submit"
            class="signup-btn"
          >
            Create Account →
          </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
          OR
        </div>


        <!-- LOGIN -->

        <div class="login">

          Already have an account?

          <a href="login.html">
            Login
          </a>

        </div>


        <div class="note">

          🔒 Your information is kept secure.
          Real authentication and verification
          will be connected later.

        </div>

      </div>


      <!-- HOME -->

      <a
        href="index.html"
        class="back-home"
      >
        ← Back to EDIT24/7
      </a>

    </div>

  </main>


  <!-- SIGNUP DEMO LOGIC -->

  <script>

    const roleCards =
      document.querySelectorAll(".role-card");

    const signupForm =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");


    /*
      ROLE SELECTION
    */

    roleCards.forEach(function(card) {

      card.addEventListener("click", function() {

        roleCards.forEach(function(item) {

          item.classList.remove("active");

        });

        card.classList.add("active");

        const radio =
          card.querySelector("input");

        radio.checked = true;

      });

    });


    /*
      SIGNUP
    */

    signupForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const firstName =
          document.getElementById("firstName")
            .value.trim();

        const lastName =
          document.getElementById("lastName")
            .value.trim();

        const email =
          document.getElementById("email")
            .value.trim();

        const phone =
          document.getElementById("phone")
            .value.trim();

        const password =
          document.getElementById("password")
            .value;

        const confirmPassword =
          document.getElementById("confirmPassword")
            .value;

        const terms =
          document.getElementById("terms")
            .checked;

        const selectedRole =
          document.querySelector(
            'input[name="role"]:checked'
          ).value;


        /*
          PASSWORD CHECK
        */

        if (password.length < 8) {

          showError(
            "Password must contain at least 8 characters."
          );

          return;

        }


        /*
          CONFIRM PASSWORD
        */

        if (password !== confirmPassword) {

          showError(
            "Passwords do not match."
          );

          return;

        }


        /*
          TERMS
        */

        if (!terms) {

          showError(
            "Please accept the Terms of Service and Privacy Policy."
          );

          return;

        }


        /*
          BASIC VALIDATION
        */

        if (
          !firstName ||
          !lastName ||
          !email ||
          !phone
        ) {

          showError(
            "Please fill in all required fields."
          );

          return;

        }


        /*
          SUCCESS
        */

        message.classList.add("success");

        message.style.display = "block";

        message.textContent =
          "Account details accepted. Redirecting...";


        /*
          CUSTOMER
        */

        if (selectedRole === "customer") {

          setTimeout(function() {

            window.location.href =
              "customer-dashboard.html";

          }, 800);

          return;

        }


        /*
          EDITOR
        */

        if (selectedRole === "editor") {

          setTimeout(function() {

            window.location.href =
              "editor-application.html";

          }, 800);

          return;

        }

      }
    );


    /*
      ERROR FUNCTION
    */

    function showError(text) {

      message.classList.remove("success");

      message.style.display = "block";

      message.textContent = text;

    }

  </script>

</body>
</html>
