<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — EDIT24/7</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 90%;
      max-width: 450px;
      margin: auto;
    }

    /* HEADER */

    header {
      padding: 25px 0;
      text-align: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ff3b30;
    }

    /* MAIN */

    main {
      padding: 40px 0 60px;
    }

    .login-box {
      background: #111;
      border: 1px solid #252525;
      border-radius: 16px;
      padding: 32px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* ROLE */

    .role-title {
      color: #777;
      font-size: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 25px;
    }

    .role {
      border: 1px solid #333;
      border-radius: 9px;
      padding: 13px 5px;
      text-align: center;
      cursor: pointer;
      color: #aaa;
      font-size: 12px;
      transition: 0.2s;
    }

    .role:hover {
      border-color: #666;
      color: white;
    }

    .role.active {
      border-color: #ff3b30;
      background: #171010;
      color: white;
    }

    .role input {
      display: none;
    }

    .role-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 5px;
    }

    /* FORM */

    .form-group {
      margin-bottom: 20px;
    }

    label.form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 13px;
      background: #090909;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #666;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot {
      color: #ff3b30;
      font-size: 13px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    /* LOGIN BUTTON */

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #ff3b30;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    /* MESSAGE */

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #241212;
      border: 1px solid #4a2222;
      color: #ff8b84;
      font-size: 12px;
      text-align: center;
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #555;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #292929;
      flex: 1;
    }

    /* SIGNUP */

    .signup {
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    .signup a {
      color: #ff3b30;
      font-weight: bold;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    .security {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 20px;
    }

    .back-home {
      display: block;
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 18px;
    }

    .back-home:hover {
      color: white;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      .login-box {
        padding: 22px;
      }

      .role-selector {
        grid-template-columns: 1fr 1fr;
      }

      .role:last-child {
        grid-column: 1 / -1;
      }

    }
  </style>
</head>

<body>


  <!-- HEADER -->

  <header>

    <a href="index.html" class="logo">
      EDIT<span>24/7</span>
    </a>

  </header>


  <!-- MAIN -->

  <main>

    <div class="container">

      <div class="login-box">

        <h1>
          Welcome Back
        </h1>

        <p class="subtitle">
          Login to your EDIT24/7 account.
        </p>


        <!-- ROLE -->

        <div class="role-title">
          Login as
        </div>

        <div class="role-selector">


          <!-- CUSTOMER -->

          <label class="role active">

            <input
              type="radio"
              name="role"
              value="customer"
              checked
            >

            <span class="role-icon">
              👤
            </span>

            Customer

          </label>


          <!-- EDITOR -->

          <label class="role">

            <input
              type="radio"
              name="role"
              value="editor"
            >

            <span class="role-icon">
              🎬
            </span>

            Editor

          </label>


          <!-- ADMIN -->

          <label class="role">

            <input
              type="radio"
              name="role"
              value="admin"
            >

            <span class="role-icon">
              ⚙️
            </span>

            Admin

          </label>

        </div>


        <!-- ERROR / MESSAGE -->

        <div
          class="message"
          id="message"
        >
          Please enter your email and password.
        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


          <!-- EMAIL -->

          <div class="form-group">

            <label
              class="form-label"
              for="email"
            >
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            >

          </div>


          <!-- PASSWORD -->

          <div class="form-group">

            <div class="password-row">

              <label
                class="form-label"
                for="password"
              >
                Password
              </label>

              <a
                href="forgot-password.html"
                class="forgot"
              >
                Forgot password?
              </a>

            </div>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

          </div>


          <!-- LOGIN -->

          <button
            type="submit"
            class="login-btn"
          >
            Login →
          </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
          OR
        </div>


        <!-- SIGNUP -->

        <div class="signup">

          Don't have an account?

          <a href="signup.html">
            Create Account
          </a>

        </div>

      </div>


      <div class="security">
        🔒 Your account information is protected.
      </div>


      <a
        href="index.html"
        class="back-home"
      >
        ← Back to EDIT24/7
      </a>

    </div>

  </main>


  <!-- DEMO LOGIN SYSTEM -->

  <script>

    const roles = document.querySelectorAll(".role");

    const form = document.getElementById("loginForm");

    const message = document.getElementById("message");


    /*
      ROLE SELECTION
    */

    roles.forEach(function(role) {

      role.addEventListener("click", function() {

        roles.forEach(function(item) {
          item.classList.remove("active");
        });

        role.classList.add("active");

        const radio = role.querySelector("input");

        radio.checked = true;

      });

    });


    /*
      LOGIN

      NOTE:
      This is only frontend/demo routing.

      Real authentication will be connected
      later with database + backend.
    */

    form.addEventListener("submit", function(event) {

      event.preventDefault();


      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value.trim();

      const selectedRole =
        document.querySelector(
          'input[name="role"]:checked'
        ).value;


      if (!email || !password) {

        message.style.display = "block";

        message.textContent =
          "Please enter your email and password.";

        return;
      }


      message.style.display = "none";


      /*
        CUSTOMER
      */

      if (selectedRole === "customer") {

        window.location.href =
          "customer-dashboard.html";

        return;
      }


      /*
        EDITOR
      */

      if (selectedRole === "editor") {

        window.location.href =
          "editor-dashboard.html";

        return;
      }


      /*
        ADMIN
      */

      if (selectedRole === "admin") {

        window.location.href =
          "admin-dashboard.html";

        return;
      }

    });

  </script>

</body>
</html>
