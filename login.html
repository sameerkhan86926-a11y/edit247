<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — EDIT24/7</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 450px;
      margin: auto;
    }

    header {
      padding: 25px 0;
      text-align: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #ff3b30;
    }

    main {
      padding: 50px 0;
    }

    .login-box {
      background: #111;
      border: 1px solid #252525;
      border-radius: 16px;
      padding: 32px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .role {
      border: 1px solid #333;
      border-radius: 9px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      color: #aaa;
    }

    .role:hover {
      border-color: #ff3b30;
      color: white;
    }

    .role input {
      margin-right: 7px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 13px;
      background: #090909;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
      font-size: 15px;
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot {
      color: #ff3b30;
      font-size: 13px;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #ff3b30;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #555;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #292929;
      flex: 1;
    }

    .signup {
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    .signup a {
      color: #ff3b30;
      text-decoration: none;
      font-weight: bold;
    }

    .security {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 500px) {
      .login-box {
        padding: 22px;
      }

      .role-selector {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      EDIT<span>24/7</span>
    </div>
  </header>

  <main>

    <div class="container">

      <div class="login-box">

        <h1>Welcome Back</h1>

        <p class="subtitle">
          Login to your EDIT24/7 account.
        </p>


        <div class="role-selector">

          <label class="role">
            <input
              type="radio"
              name="role"
              value="customer"
              checked
            >
            Customer
          </label>

          <label class="role">
            <input
              type="radio"
              name="role"
              value="editor"
            >
            Editor
          </label>

        </div>


        <form>

          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            >

          </div>


          <div class="form-group">

            <div class="password-row">

              <label for="password">
                Password
              </label>

              <a
                href="forgot-password.html"
                class="forgot"
              >
                Forgot password?
              </a>

            </div>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

          </div>


          <button
            type="submit"
            class="login-btn"
          >
            Login →
          </button>

        </form>


        <div class="divider">
          OR
        </div>


        <div class="signup">

          Don't have an account?

          <a href="signup.html">
            Create Account
          </a>

        </div>

      </div>


      <div class="security">
        🔒 Your account information is protected.
      </div>

    </div>

  </main>

</body>
</html>
