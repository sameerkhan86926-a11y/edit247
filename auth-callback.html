<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verifying Account — EDIT24/7</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 35px;
      text-align: center;
      background: #111;
      border: 1px solid #252525;
      border-radius: 16px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .logo span {
      color: #ff3b30;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 0 auto 20px;
      border: 3px solid #333;
      border-top-color: #ff3b30;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      display: none;
      color: #ff8b84;
      margin-top: 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      EDIT<span>24/7</span>
    </div>

    <div class="loader" id="loader"></div>

    <h1 id="title">
      Verifying your account...
    </h1>

    <p id="text">
      Please wait while we complete your verification.
    </p>

    <p id="error" class="error"></p>

  </div>


  <script type="module">

    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
      "https://elnjavwjxgkiretyxbtt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_FXhmywNoVuWiwP4PJ1UHUQ_LwNG6Q00";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function handleVerification() {

      try {

        /*
          Supabase confirmation email can
          return access_token in the URL hash.

          Example:

          #access_token=...
          &refresh_token=...
          &type=signup
        */

        const hash =
          window.location.hash;


        if (!hash) {

          throw new Error(
            "No verification information was found in the URL."
          );

        }


        /*
          Read the hash parameters.
        */

        const params =
          new URLSearchParams(
            hash.substring(1)
          );


        const accessToken =
          params.get("access_token");

        const refreshToken =
          params.get("refresh_token");

        const type =
          params.get("type");


        if (!accessToken) {

          throw new Error(
            "Verification token was not found."
          );

        }


        /*
          Create the Supabase session
          using the tokens returned by
          the confirmation email.
        */

        const {
          data,
          error
        } =
          await supabase.auth.setSession({

            access_token:
              accessToken,

            refresh_token:
              refreshToken || ""

          });


        if (error) {

          throw error;

        }


        if (!data.session) {

          throw new Error(
            "Unable to create an active session."
          );

        }


        /*
          Get verified user.
        */

        const user =
          data.session.user;


        const role =
          user.user_metadata?.role ||
          "customer";


        /*
          SUCCESS
        */

        document.getElementById("title")
          .textContent =
          "Account verified successfully!";


        document.getElementById("text")
          .textContent =
          "Your EDIT24/7 account is ready. Redirecting...";


        /*
          Remove tokens from URL.
        */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        /*
          Redirect according to role.
        */

        setTimeout(function() {

          if (role === "editor") {

            window.location.href =
              "editor-application.html";

          } else {

            window.location.href =
              "customer-dashboard.html";

          }

        }, 1000);


      } catch (error) {

        console.error(
          "AUTH CALLBACK ERROR:",
          error
        );


        document.getElementById("loader")
          .style.display = "none";


        document.getElementById("title")
          .textContent =
          "Verification problem";


        document.getElementById("text")
          .style.display = "none";


        const errorBox =
          document.getElementById("error");


        errorBox.style.display =
          "block";


        errorBox.textContent =
          error.message ||
          "Unable to complete verification.";

      }

    }


    handleVerification();

  </script>

</body>
</html>
